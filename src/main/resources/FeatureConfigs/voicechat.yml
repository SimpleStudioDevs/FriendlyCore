messages:
  format: "<gray>[<group>] <light_purple><player>: <white><message>"
  spy_format: "<dark_gray>[VC Spy] <gray>[<group>] <player>: <message>"
  players_only: "<red>You must be a player to use this command!</red>"
  no_permission: "<red>You don't have permission to use this command.</red>"
  not_in_group: "<red>You are not in a VoiceChat group!</red>"
  blocked: "<red>Your message was blocked for inappropriate language.</red>"
  toggle_on: "<gray>Your messages will now go to your VoiceChat group.</gray>"
  toggle_off: "<gray>Your messages will now go to public chat.</gray>"
  toggle_group_left: "<red>You are no longer in a VoiceChat group, so /vc toggle was turned off. Your message was not sent.</red>"
  spy_status: "<gray>VoiceChat spy: <status>"
  spy_on: "<green>ON</green>"
  spy_off: "<red>OFF</red>"
  spy_usage: "<red>Usage:</red> <yellow>/vcspy [toggle|on|off|status]</yellow>"
  admin_usage: "<red>Usage:</red> <yellow>/vcadmin password <player></yellow>"
  admin_player_not_found: "<red>No online player named <white><player></white>.</red>"
  admin_target_not_in_group: "<red><player> is not in a VoiceChat group.</red>"
  admin_no_password: "<gray>Group <white><group></white> (<player>) has no password.</gray>"
  admin_password: "<gray>Password for group <white><group></white> (<player>): <white><password></white></gray>"
  admin_password_failed: "<red>Could not read the password for <white><group></white>. Check the console.</red>"
