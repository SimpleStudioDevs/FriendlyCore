name: FriendlyCore
main: com.friendlysmp.core.FriendlyCorePlugin
version: 1.0.0
api-version: "1.20"
folia-supported: true
softdepend: [PlaceholderAPI, Vault, ZelDuels, Essentials, ZelChat, voicechat]
depend: [packetevents]
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.45.3.0

commands:
  friendlycore:
    description: FriendlyCore admin command
    usage: /friendlycore reload
  withersound:
    description: Toggle the Wither death sound for yourself.
    usage: /withersound [toggle|on|off|status]
  hidearmor:
    description: Toggle whether other players can see your armor.
    usage: /hidearmor [toggle|on|off|status|seeall]
  deathmessages:
    description: Toggle whether you see death messages.
    usage: /deathmessages [toggle|on|off|status]
  token:
    description: Token command
    usage: /token
  cic:
    description: CreativeItemCommand Admin command
    usage: /cic <reload|list|store>
  commandmaker:
    description: CommandMaker admin command
    usage: /commandmaker help
    aliases: [cm]
  pbroadcast:
    description: Send a paid broadcast message
    usage: "/pbroadcast <message>"
    permission: friendlycore.pbc.use
    aliases: [pbc]
  pbreload:
    description: Reload PlayerBroadcast config
    usage: "/pbreload"
    permission: friendlycore.pbc.admin
  chatpatrol:
    description: Reload ChatPatrol
    permission: friendlycore.admin
    aliases:
      - cp
  bottlexp:
    description: Store XP points into a bottle
    usage: /bottlexp <amount|all>
    aliases: [ bxp ]
  achievementguard:
    description: Reload achievementguad
    usage: /achievementguard reload

  voidguard:
    description: Use voidguard
    usage: /voidguard set
  pcg:
    description: Start custom chatgames
    usage: /pcg <question in quotes> <answer in quotes>
  granthomes:
    description: Grant bonus homes to a player
    usage: /granthomes <player> <amount>
  revokehomes:
    description: Revoke bonus homes from a player
    usage: /revokehomes <player> <amount>

  voicechat:
    aliases: [vc]
    usage: /vc <message|toggle>
  vcspy:
    description: Toggle seeing /vc messages from all VoiceChat groups
    usage: /vcspy [toggle|on|off|status]
    permission: friendlycore.voicechat.spy
  vcadmin:
    description: VoiceChat admin tools
    usage: /vcadmin password <player>
    permission: friendlycore.voicechat.admin

permissions:
  friendlycore.admin:
    default: op
  friendlycore.voicechat.spy:
    description: See /vc messages from all VoiceChat groups
    default: op
  friendlycore.voicechat.admin:
    description: Use /vcadmin
    default: op
  # Tokens
  friendlycore.tokens.admin:
    default: op
  # CIC
  cic.bypass.enchantments:
    description: Bypass enchantment checks
    default: op
  cic.bypass.attributes:
    description: Bypass attribute checks
    default: op
  cic.bypass.potions:
    description: Bypass custom potion checks
    default: op
  cic.admin:
    default: op
  cic.give:
    default: op
  # PBC
  friendlycore.pbc.use:
    description: Allows using the broadcast command
    default: op
  friendlycore.pbc.admin:
    description: Allows reloading the plugin
    default: op
  friendlycore.pbc.free-uses:
    description: Parent for pbc free use perms

  # Chatgames
  friendlycore.chatgames:
    description: Allows access to custom chatgames command